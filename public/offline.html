<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17332E">
<title>آفلاین هستید · You are offline · Inview</title>
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<style>
:root{--ink:#121714;--paper:#F4F0E8;--surface:#FFFCF7;--line:#D2CBBE;--muted:#5A564E;--pine:#17332E;--ochre:#A85A32}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}
body{display:grid;place-items:center;min-height:100dvh;padding:24px 16px;font:16px/1.6 Tahoma,'Helvetica Neue',Arial,sans-serif}
main{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);padding:32px 24px}
.rule{display:block;width:40px;height:2px;background:var(--ochre);margin:0 0 20px}
h1{font-size:1.5rem;line-height:1.3;margin:0 0 8px;font-weight:700}
p{margin:0 0 16px;color:var(--muted)}
section+section{margin-top:28px;padding-top:24px;border-top:1px solid var(--line)}
.en{direction:ltr;text-align:left;font-family:'Helvetica Neue',Arial,sans-serif}
.en h2{font-size:1.1rem;margin:0 0 6px;color:var(--ink)}
a.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;background:var(--pine);color:#fff;text-decoration:none;font-weight:600}
a.btn:focus-visible{outline:3px solid var(--ochre);outline-offset:3px}
.brand{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--pine);margin:0 0 20px}
</style>
</head>
<body>
<main>
<p class="brand" lang="en" dir="ltr">Inview</p>
<section>
<span class="rule" aria-hidden="true"></span>
<h1>اتصال اینترنت برقرار نیست</h1>
<p>این صفحه هنوز روی تلفن شما ذخیره نشده است. وقتی دوباره به اینترنت وصل شدید، صفحه را باز کنید.</p>
<a class="btn" href="/g/o-gallery">دوباره امتحان کنید</a>
</section>
<section class="en" lang="en" dir="ltr">
<h2>You are offline</h2>
<p>This page is not saved on your phone yet. Open it again when you are back online.</p>
<a class="btn" href="/g/o-gallery">Try again</a>
</section>
</main>
</body>
</html>
